[project]
name = "langwish"
version = "0.0.0"
description = "A research knowledge base of programming languages: how they work, how they relate, with evidence."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "ao3575911" }]
dependencies = ["typer>=0.12", "rich>=13.7"]

[project.scripts]
langwish = "langwish.cli.app:main"

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "pytest-cov>=5", "pip-audit>=2.7", "build>=1.2"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langwish"]

[tool.hatch.build.targets.sdist]
exclude = ["data-packs/rosetta-gfdl/**", "data-packs/cc-by-sa/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = ["S101", "PT018"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
addopts = "-q --cov=langwish.core --cov=langwish.cli --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
