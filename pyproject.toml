[project]
name = "langsuite"
version = "1.0.0"
description = "A research knowledge base of programming languages: how they work, how they relate, with evidence."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "ao3575911" }]
keywords = ["programming-languages", "research", "knowledge-base", "cli", "tui", "telegram-bot"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "textual>=8.2.8",
    "textual-serve>=1.1.3",
    "duckdb>=1.1",
    "pyyaml>=6",
    "platformdirs>=4",
    "numpy>=2.5.4",
    "python-telegram-bot[job-queue]==22.8",
]

[project.urls]
Homepage = "https://github.com/ao3575911/langsuite"
Source = "https://github.com/ao3575911/langsuite"
Changelog = "https://github.com/ao3575911/langsuite/blob/main/CHANGELOG.md"
Issues = "https://github.com/ao3575911/langsuite/issues"

[project.scripts]
langsuite = "langsuite.cli.app:main"

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "pip-audit>=2.7",
    "build>=1.2",
    "pytest-textual-snapshot>=1.0.0",
    "pytest-asyncio>=1.4.1",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langsuite"]

[tool.hatch.build.targets.sdist]
exclude = ["data-packs/rosetta/**", "data-packs/cc-by-sa/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = ["S101", "PT018"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607"]
"scripts/**" = ["S603", "S607"]
# Paths under /tmp here are inside the sandbox container's private tmpfs, not the host.
"src/langsuite/verify/toolchains.py" = ["S108"]
"src/langsuite/verify/sandbox.py" = ["S108", "S603"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
markers = ["docker: runs real containers; skipped without Docker unless LANGSUITE_REQUIRE_DOCKER=1"]
addopts = "-q --cov=langsuite.core --cov=langsuite.cli --cov=langsuite.ingest --cov=langsuite.verify --cov=langsuite.bot --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
