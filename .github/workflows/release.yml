name: Release
# Publishes to PyPI with trusted publishing (OIDC): no API token is stored anywhere.
# Runs only when a maintainer pushes a tag like v1.0.0. Nothing here creates tags.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches package version
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "::error::tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: uv sync --locked
      - run: uv run ruff check . && uv run mypy
      - run: uv run pytest
      - run: uv build --out-dir dist
      - name: Wheel and sdist have no GFDL / CC BY-SA content
        run: python3 scripts/check_wheel_licences.py dist/*.whl
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/langsuite/
    permissions:
      id-token: write  # trusted publishing; the only elevated permission
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
