name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run mypy
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
        env:
          # Linux runners have Docker: the sandbox acceptance tests must run there.
          LANGSUITE_REQUIRE_DOCKER: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      - name: Upload snapshot report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-report-${{ matrix.os }}
          path: snapshot_failures/
          if-no-files-found: ignore
  licence-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel --out-dir dist
      - name: Wheel has no GFDL / CC BY-SA content
        run: python3 scripts/check_wheel_licences.py dist/*.whl
      - name: Planted GFDL file must fail the check
        run: |
          echo "GNU Free Documentation License 1.2" > src/langsuite/planted.txt
          uv build --wheel --out-dir planted
          if python3 scripts/check_wheel_licences.py planted/*.whl; then
            echo "::error::planted GFDL file was not caught"; exit 1
          fi
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt > req.txt
      - run: uvx pip-audit --strict -r req.txt
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose .

  kb-live:
    # Optional (not a required check): builds the real base from PLDB + Linguist.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Build knowledge base from live sources
        env:
          LANGSUITE_HOME: ${{ runner.temp }}/langsuite
        run: |
          uv run langsuite --plain base build
          uv run langsuite --plain base status
          uv run langsuite --plain lang show haskell --evidence
      - name: Live acceptance test
        env:
          LANGSUITE_LIVE: "1"
        run: uv run pytest tests/test_kb.py tests/test_discover.py -k live --no-cov

  verifier-toolchains:
    # Optional (not a required check): every pinned toolchain runs its hello world.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - env:
          LANGSUITE_VERIFY_ALL: "1"
          LANGSUITE_REQUIRE_DOCKER: "1"
        run: uv run pytest tests/test_verify.py -m docker --no-cov
