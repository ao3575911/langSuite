name: Feature request
description: Suggest a new command, pane, bot feature or method.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. A sample command or output helps.
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [CLI, TUI, Telegram bot, MCP, Webhooks, Data]
      multiple: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
